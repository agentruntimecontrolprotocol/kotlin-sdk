build:
  maxIssues: 0
  excludeCorrectable: false

# Complexity limits codify KOTLIN_STYLE.md §11.
complexity:
  TooManyFunctions:
    active: false
  LongParameterList:
    active: true
    functionThreshold: 5
    constructorThreshold: 7
    ignoreDefaultParameters: false
    ignoreDataClasses: true
  LongMethod:
    active: true
    threshold: 30
  CyclomaticComplexMethod:
    active: true
    threshold: 10
    ignoreSingleWhenExpression: true
    ignoreSimpleWhenEntries: true
  CognitiveComplexMethod:
    active: true
    threshold: 15
  LargeClass:
    active: true
    threshold: 300
  NestedBlockDepth:
    active: true
    threshold: 3

style:
  MagicNumber:
    # Off intentionally: in this codebase the only matches are JDBC positional
    # parameter indices (ps.setString(N, ...)), which is not what the rule is
    # for. Re-evaluate if/when business logic with literal constants appears.
    active: false
  ReturnCount:
    active: true
    max: 3
    excludedFunctions:
      - 'equals'
  UnusedPrivateMember:
    active: true
  ForbiddenComment:
    # Catches stray TODO:, FIXME:, STOPSHIP: in main source. Currently zero
    # hits — the codebase tracks deferred work in CONFORMANCE.md and PLAN.md
    # rather than inline. This locks that convention in.
    active: true
    comments:
      - reason: 'TODO marker — track deferred work in CONFORMANCE.md / PLAN.md instead'
        value: '\bTODO:'
      - reason: 'FIXME marker — open an issue or fix it'
        value: '\bFIXME:'
      - reason: 'STOPSHIP marker — must not land'
        value: '\bSTOPSHIP:'
      - reason: 'XXX marker — clarify or replace'
        value: '\bXXX:'
  WildcardImport:
    # Codebase has zero wildcard imports. ktlint's no-wildcard-imports rule
    # is also enabled in .editorconfig; this is detekt's belt-and-suspenders.
    active: true
  MaxLineLength:
    active: true
    maxLineLength: 100
    excludePackageStatements: true
    excludeImportStatements: true
    excludeCommentStatements: false
  ThrowsCount:
    active: false
  ForbiddenMethodCall:
    active: true
    methods:
      - reason: 'GlobalScope is forbidden — inject a CoroutineScope (KOTLIN_STYLE §7).'
        value: 'kotlinx.coroutines.GlobalScope'

naming:
  MatchingDeclarationName:
    active: false
  FunctionNaming:
    active: true

exceptions:
  TooGenericExceptionCaught:
    # §8 forbids bare `catch (e: Exception)` without rethrowing or narrowing.
    # The few in lib/runtime rethrow CancellationException and then log+handle
    # Exception — which is the idiomatic Kotlin coroutine pattern. Keep this
    # off but enforce via the explicit §15 sweep documented in REFACTOR_PLAN.
    active: false
  SwallowedException:
    active: false

comments:
  UndocumentedPublicClass:
    active: true
    searchInProtectedClass: false
    searchInNestedClass: false
    searchInInnerClass: false
    searchInInnerObject: false
    searchInInnerInterface: false
  UndocumentedPublicFunction:
    active: true
  UndocumentedPublicProperty:
    # Off intentionally: the public surface is dominated by @Serializable
    # message-catalog records where each property carries an @SerialName
    # equal to the protocol field name and the enclosing class KDoc
    # explains the message semantics. Per-property KDoc would just restate
    # the field name. UndocumentedPublicClass / Function remain enforced.
    # See STYLE_GUIDE_FEEDBACK.md.
    active: false
