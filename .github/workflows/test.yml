# CI workflow for kotlin-sdk (Gradle, JDK 21).
#
# Action pinning policy:
#   - First-party actions (actions/*) are pinned to a major tag.
#   - Third-party actions are pinned to a full commit SHA with a version
#     comment alongside.
name: test

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: test (JDK ${{ matrix.java }})
    runs-on: [self-hosted, linux, arm64, arcp]
    strategy:
      fail-fast: false
      matrix:
        # lib/build.gradle.kts pins kotlin.jvmToolchain(21). foojay-resolver
        # auto-provisions matching JDKs, but pre-installing speeds up cold runs.
        java: ['21']
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle

      - name: Validate Gradle wrapper
        # gradle/actions/wrapper-validation v4.4.4
        uses: gradle/actions/wrapper-validation@5e2ebd065dc2488b7a6ad670704656cbbe1e8f60

      # Scoped to lib/cli/tests. samples/ contains demo packages with
      # underscored names and filenames that intentionally don't follow the
      # library's style rules.
      - name: ktlint
        run: ./gradlew --no-daemon :lib:ktlintCheck :cli:ktlintCheck :tests:ktlintCheck

      - name: detekt
        run: ./gradlew --no-daemon :lib:detekt :cli:detekt :tests:detekt

      - name: Build
        run: ./gradlew --no-daemon assemble

      - name: Test (with Kover coverage)
        run: ./gradlew --no-daemon test koverXmlReport

      # Aggregated Kover XML lives at build/reports/kover/report.xml in the
      # root project (see build.gradle.kts kover { } block, which depends on
      # lib + tests). Non-blocking so a Codecov outage cannot break CI.
      - name: Upload coverage to Codecov
        # codecov/codecov-action v6.0.1
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          fail_ci_if_error: false
          flags: unittests
          files: ./build/reports/kover/report.xml
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-jdk${{ matrix.java }}
          path: |
            **/build/reports/tests/
            **/build/reports/ktlint/
            **/build/reports/detekt/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
